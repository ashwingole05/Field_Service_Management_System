services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://db:5432/fieldservice
      DATABASE_USERNAME: fieldservice
      DATABASE_PASSWORD: fieldservice
      JWT_SECRET: change-this-local-secret-change-this-local-secret-123456
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldservice
      POSTGRES_USER: fieldservice
      POSTGRES_PASSWORD: fieldservice
    ports:
      - "5432:5432"
    volumes:
      - fieldservice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldservice -d fieldservice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fieldservice-postgres:
